# Explicit, read-only public Spot data. No API key or account access is required.
# Loading/constructing a provider does not make a request; fetch_ohlcv() does.
# Do not add csv_path or credentials to this source configuration.

[market_data]
symbol = "BTCUSDT"
timeframe = "15m"
data_source = "binance_public"
history_limit = 500
missing_value_policy = "error"
timeout_seconds = 10.0

[analysis]
# Total window of five candles: two left + pivot + two right.
fractal_length = 5

[liquidity]
price_unit = "USDT"
equal_tolerance_bps = "0"
