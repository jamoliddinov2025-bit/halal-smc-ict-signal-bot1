# Phase 21: deterministic walk-forward robustness validation.
# Walk-forward windows slice one declared historical dataset into sequential
# development (train) and validation (test) periods and replay each window as
# one independent UNCHANGED Phase 20 backtest: no second strategy, detector,
# classifier, or formula exists. Cross-period, cross-asset (symbol),
# cross-timeframe, and market-regime buckets, development-to-validation
# degradation, and stability indicators are descriptive research records over
# published BUY_SIGNAL facts: no optimization, parameter selection,
# self-modification, live trading, or advice. Halal eligibility stays external
# and configurable through the existing [halal_filter] registry.
symbol = "BTCUSDT"
timeframe = "15m"
data_source = "csv"
history_limit = 500
csv_path = "../tests/fixtures/mtf-15m.csv"
missing_value_policy = "error"
timeout_seconds = 10.0

[analysis]
fractal_length = 3

[liquidity]
price_unit = "USDT"
equal_tolerance_bps = "0"

[displacement]
atr_period = 14
min_body_atr = "1.0"
min_range_atr = "1.5"
bullish_close_min = "0.70"
bearish_close_max = "0.30"
atr_floor = "0"
sweep_lookback_bars = 20

[fvg]
min_gap_size = "0"
require_displacement = false

[order_blocks]
max_candidate_lookback = 10
candidate_selection = "nearest"
zone_basis = "full_range"
allow_doji = false
structure_requirement = "bos_or_choch"
require_fvg = false

[premium_discount]
equilibrium_half_width_fraction = "0"

[ote]
lower_retracement = "0.62"
upper_retracement = "0.79"
boundary_policy = "inclusive"
price_basis = "close"

[mtf]
enabled = true
primary_timeframe = "15m"
higher_timeframes = ["1h", "4h"]
availability_policy = "completed_candle"

[halal_filter]
mode = "allow_list"
allowed_assets = [
  "BTCUSDT",
  "ETHUSDT",
  "BNBUSDT",
  "SOLUSDT",
]

[setup_quality]
publish_threshold = 75

[signal_eligibility]
enabled = true
conflict_policy = "neutral"

[signal_engine]
enabled = true
publish_threshold = 75
spot_only = true
duplicate_policy = "one_per_setup"

[outcome_tracking]
enabled = true
horizon_bars = 10

[backtest]
enabled = true

[robustness]
enabled = true
development_bars = 50
validation_bars = 25
step_bars = 25
regime_lookback_bars = 20
regime_baseline_multiple = 4
trend_threshold = "0.30"
high_volatility_threshold = "1.50"
low_volatility_threshold = "0.75"
minimum_finalized_for_stability = 10
minimum_windows_for_stability = 3
stability_win_rate_floor = "0.50"
maximum_win_rate_spread = "0.50"

[setup_attribution]
enabled = true

[performance]
enabled = true
minimum_finalized_for_ranking = 10
