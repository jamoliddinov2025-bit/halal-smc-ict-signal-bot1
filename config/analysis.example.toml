# Phase 3 offline methodology example: synthetic candles, not Binance observations.
# A compact three-candle fractal makes the hand-computed confirmations easy to audit.
# No networking or strategy/entry/exit logic is enabled by this configuration.

[market_data]
symbol = "BTCUSDT"
timeframe = "15m"
data_source = "csv"
history_limit = 500
csv_path = "../tests/fixtures/market_structure.csv"
missing_value_policy = "error"
timeout_seconds = 10.0

[analysis]
# Total odd window size: one candle on each side; confirmation delay = 1 candle.
fractal_length = 3
