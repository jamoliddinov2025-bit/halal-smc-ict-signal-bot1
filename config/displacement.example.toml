# Phase 5: twenty explicitly synthetic candles, not live exchange observations.
# No signals, scores, strategy, account access, or execution are enabled.
[market_data]
symbol = "BTCUSDT"
timeframe = "15m"
data_source = "csv"
history_limit = 500
csv_path = "../tests/fixtures/displacement.csv"
missing_value_policy = "error"
timeout_seconds = 10.0

[analysis]
fractal_length = 5

[liquidity]
price_unit = "USDT"
equal_tolerance_bps = "0"

[displacement]
atr_period = 14
min_body_atr = "1.0"
min_range_atr = "1.5"
bullish_close_min = "0.70"
bearish_close_max = "0.30"
atr_floor = "0"
sweep_lookback_bars = 20
