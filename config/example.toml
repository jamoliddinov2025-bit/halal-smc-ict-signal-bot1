# Phase 15 offline configuration. Separate loaders consume each runtime table.
# Project/scope/safety tables document intent, not a runtime trading policy engine.
# This CSV is explicitly synthetic test data, not historical Binance observations.
# Never add credentials or account data.

[project]
name = "Professional Halal SMC/ICT Spot Signal Bot"
phase = 15

[scope]
market = "spot"
direction = "long_only"
signal_only = true

[safety]
authenticated_exchange_access = false
order_execution = false
leverage = false
margin = false
short_selling = false

[market_data]
symbol = "BTCUSDT"
timeframe = "15m"
data_source = "csv"
history_limit = 500
# Resolved relative to this TOML file, not the process working directory.
csv_path = "../tests/fixtures/ohlcv.csv"
missing_value_policy = "error"
timeout_seconds = 10.0

[analysis]
# Total window of five candles: two left + pivot + two right.
fractal_length = 5

[liquidity]
price_unit = "USDT"
equal_tolerance_bps = "0"

[displacement]
atr_period = 14
min_body_atr = "1.0"
min_range_atr = "1.5"
bullish_close_min = "0.70"
bearish_close_max = "0.30"
atr_floor = "0"
sweep_lookback_bars = 20

[fvg]
min_gap_size = "0"
require_displacement = false

[order_blocks]
max_candidate_lookback = 10
candidate_selection = "nearest"
zone_basis = "full_range"
allow_doji = false
structure_requirement = "bos_or_choch"
require_fvg = false

[premium_discount]
equilibrium_half_width_fraction = "0"

[mss]
enable_displacement_requirement = true
enable_structure_requirement = true

[breaker_blocks]
require_displacement = true
require_mss = true
invalidation_basis = "close_through_far_boundary"
zone_basis = "original_order_block"

[mitigation_blocks]
interaction_basis = "range_intersection"
first_interaction_only = true
ignore_after_breaker = true

[ote]
lower_retracement = "0.62"
upper_retracement = "0.79"
boundary_policy = "inclusive"
price_basis = "close"

[mtf]
enabled = true
primary_timeframe = "15m"
higher_timeframes = ["1h", "4h"]
availability_policy = "completed_candle"

[halal_filter]
mode = "allow_list"
allowed_assets = [
  "BTCUSDT",
  "ETHUSDT",
  "BNBUSDT",
  "SOLUSDT",
]

[setup_quality]
publish_threshold = 75
