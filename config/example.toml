# Phase 5 offline configuration. Separate loaders consume each runtime table.
# Project/scope/safety tables document intent, not a runtime trading policy engine.
# This CSV is explicitly synthetic test data, not historical Binance observations.
# Never add credentials or account data.

[project]
name = "Professional Halal SMC/ICT Spot Signal Bot"
phase = 5

[scope]
market = "spot"
direction = "long_only"
signal_only = true

[safety]
authenticated_exchange_access = false
order_execution = false
leverage = false
margin = false
short_selling = false

[market_data]
symbol = "BTCUSDT"
timeframe = "15m"
data_source = "csv"
history_limit = 500
# Resolved relative to this TOML file, not the process working directory.
csv_path = "../tests/fixtures/ohlcv.csv"
missing_value_policy = "error"
timeout_seconds = 10.0

[analysis]
# Total window of five candles: two left + pivot + two right.
fractal_length = 5

[liquidity]
price_unit = "USDT"
equal_tolerance_bps = "0"

[displacement]
atr_period = 14
min_body_atr = "1.0"
min_range_atr = "1.5"
bullish_close_min = "0.70"
bearish_close_max = "0.30"
atr_floor = "0"
sweep_lookback_bars = 20
