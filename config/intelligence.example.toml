# Phase 22: deterministic Strategy Intelligence research reporting.
# Strategy Intelligence is a consumer-only descriptive layer over a Phase 21
# walk-forward RobustnessReport: it groups the published, out-of-sample spot
# BUY_SIGNAL validation facts by signal-time strategy profiles (setup
# combination, symbol, timeframe, month, causal regime) and reports exact
# winner/loser patterns, strength/weakness diagnostics, and deterministic
# research rankings gated by a minimum finalized sample. It never re-runs the
# replay, re-detects regimes, or recomputes outcomes: no second strategy,
# detector, classifier, or formula exists. Research only: no optimization,
# parameter or threshold tuning, automatic strategy selection, enabling or
# disabling of setups, signal veto, feedback into signal generation,
# self-modification, live trading, or advice. Halal eligibility stays external
# and configurable through the existing [halal_filter] registry.
symbol = "BTCUSDT"
timeframe = "15m"
data_source = "csv"
history_limit = 500
csv_path = "../tests/fixtures/mtf-15m.csv"
missing_value_policy = "error"
timeout_seconds = 10.0

[analysis]
fractal_length = 3

[liquidity]
price_unit = "USDT"
equal_tolerance_bps = "0"

[displacement]
atr_period = 14
min_body_atr = "1.0"
min_range_atr = "1.5"
bullish_close_min = "0.70"
bearish_close_max = "0.30"
atr_floor = "0"
sweep_lookback_bars = 20

[fvg]
min_gap_size = "0"
require_displacement = false

[order_blocks]
max_candidate_lookback = 10
candidate_selection = "nearest"
zone_basis = "full_range"
allow_doji = false
structure_requirement = "bos_or_choch"
require_fvg = false

[premium_discount]
equilibrium_half_width_fraction = "0"

[ote]
lower_retracement = "0.62"
upper_retracement = "0.79"
boundary_policy = "inclusive"
price_basis = "close"

[mtf]
enabled = true
primary_timeframe = "15m"
higher_timeframes = ["1h", "4h"]
availability_policy = "completed_candle"

[halal_filter]
mode = "allow_list"
allowed_assets = [
  "BTCUSDT",
  "ETHUSDT",
  "BNBUSDT",
  "SOLUSDT",
]

[setup_quality]
publish_threshold = 75

[signal_eligibility]
enabled = true
conflict_policy = "neutral"

[signal_engine]
enabled = true
publish_threshold = 75
spot_only = true
duplicate_policy = "one_per_setup"

[outcome_tracking]
enabled = true
horizon_bars = 10

[backtest]
enabled = true

[intelligence]
enabled = true
minimum_finalized_for_diagnosis = 20
minimum_finalized_for_ranking = 20
winner_win_rate_floor = "0.60"
loser_win_rate_ceiling = "0.40"

[setup_attribution]
enabled = true

[performance]
enabled = true
minimum_finalized_for_ranking = 10
